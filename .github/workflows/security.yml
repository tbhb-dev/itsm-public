---
# Credential scan: the shared gitleaks workflow over the checkout. The other
# quality gates live in ci.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: tbhb-dev/devtools/.github/workflows/scan-gitleaks.yml@0295e6950c06b0ba64c6531b292a077ac4acfd9b # v0.19.0
