---
# Credential scan: the shared gitleaks workflow over the checkout. The other
# quality gates live in ci.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: tbhb-dev/devtools/.github/workflows/scan-gitleaks.yml@1dde4f53da5fcbee3876dc2cb67da59e52b63479 # v0.15.0
