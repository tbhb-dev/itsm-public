---
# Credential scan: the shared gitleaks workflow over the checkout. The other
# quality gates live in ci.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: tbhb-dev/devtools/.github/workflows/scan-gitleaks.yml@f815d438e4253b8e773e2786e7bc3d71f1eb8719 # v0.14.2
