---
# Credential scan: the shared gitleaks workflow over the checkout. The other
# quality gates live in ci.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: tbhb-dev/devtools/.github/workflows/scan-gitleaks.yml@1901c9a096a76f08746e116dbbf22a521ab25de0 # v0.16.0
